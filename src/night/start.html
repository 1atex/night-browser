<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src resource:; style-src resource:; img-src resource: data:; form-action https://www.google.com; base-uri 'none'"
    />
    <title>Новая вкладка</title>
    <link
      rel="stylesheet"
      href="resource://newtab/prerendered/night-start.css"
    />
    <link
      rel="icon"
      href="resource://newtab/prerendered/night-newtab.svg"
    />
    <script src="resource://newtab/prerendered/night-start.js" defer></script>
  </head>
  <body>
    <main aria-label="Новая вкладка">
      <div class="home-time" id="home-clock"><div class="date" id="date"></div>
      <div class="clock" id="clock" aria-label="Текущее время"></div></div>
      <div class="home-search">
      <form action="https://www.google.com/search" method="get">
        <label for="query" class="sr-only">Поиск или адрес</label
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 4 4" /></svg
        ><input
          id="query"
          name="q"
          placeholder="Поиск или адрес"
          autocomplete="off"
          role="combobox"
          aria-autocomplete="list"
          aria-controls="suggestions"
          aria-expanded="false"
        /><button type="submit" aria-label="Искать">↗</button>
      </form>
      <div id="suggestions" role="listbox" aria-label="Подсказки" hidden></div>
      </div>
      <nav id="home-shortcuts" aria-label="Быстрые ссылки">
        <a href="https://www.youtube.com/"
          ><span class="tile-icon youtube"><img src="resource://newtab/prerendered/sites/youtube.png" alt="" /></span><span>YouTube</span></a
        >
        <a href="https://chatgpt.com/"
          ><span class="tile-icon chatgpt"><img src="resource://newtab/prerendered/sites/chatgpt.svg" alt="" /></span><span>ChatGPT</span></a
        >
        <a href="https://search.censys.io/"
          ><span class="tile-icon censys">C</span><span>Censys</span></a
        >
        <a href="https://github.com/"
          ><span class="tile-icon github"><img src="resource://newtab/prerendered/sites/github.ico" alt="" /></span><span>GitHub</span></a
        >
      </nav>
      <div id="home-widgets">
        <section class="home-widget" id="home-tabs" aria-labelledby="home-workspace-name">
          <header><h2 id="home-workspace-name">Вкладки</h2><button type="button" class="widget-link" data-home-action="memory">Память</button></header>
          <p class="widget-caption" id="home-tab-count"></p>
          <div id="home-tab-items"></div>
        </section>
        <section class="home-widget" id="home-island" aria-labelledby="home-island-name">
          <header><h2 id="home-island-name">Island</h2><button type="button" class="widget-link" data-home-action="integrations">Настроить</button></header>
          <p class="widget-caption" id="home-island-status">Проверяем подключение</p>
          <div class="widget-actions">
            <button type="button" data-home-action="pocket" disabled="disabled">Карман</button>
            <button type="button" data-home-action="browser" disabled="disabled">Вкладки</button>
            <button type="button" data-home-action="downloads" disabled="disabled">Загрузки</button>
          </div>
        </section>
      </div>
      <details id="home-customize">
        <summary>Настроить главную</summary>
        <fieldset><legend class="sr-only">Показывать на главной</legend>
          <label><input type="checkbox" data-widget="clock" checked="checked"/>Часы и дата</label>
          <label><input type="checkbox" data-widget="shortcuts" checked="checked"/>Быстрые ссылки</label>
          <label><input type="checkbox" data-widget="tabs" checked="checked"/>Текущее пространство</label>
          <label><input type="checkbox" data-widget="island" checked="checked"/>Island</label>
        </fieldset>
      </details>
    </main>
  </body>
</html>
