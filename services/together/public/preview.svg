<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="570" viewBox="0 0 1120 570" font-family="Segoe UI Variable Text, Segoe UI, system-ui, sans-serif" font-size="13" fill="#f5f5f7"><rect width="1120" height="570" rx="14" fill="#080809" /><path d="M234 8h870a8 8 0 0 1 8 8v538a8 8 0 0 1-8 8H234a8 8 0 0 1-8-8V16a8 8 0 0 1 8-8" fill="#101012" stroke="#ffffff16" /><text x="22" y="30" fill="#99999e">◧　 ←　 →　 ⟳</text><rect x="12" y="46" width="200" height="34" rx="17" fill="#ffffff14" /><text x="28" y="67">⌕　docs.night-browser</text><text x="24" y="112">⌄　Разработка</text><text x="189" y="112" fill="#99999e">＋</text><path d="M14 130h194" stroke="#ffffff12" /><text x="24" y="159">⌄　Проекты</text><rect x="27" y="173" width="185" height="34" rx="17" fill="#ffffff29" /><circle cx="45" cy="190" r="6" fill="#c3ccd9" /><text x="60" y="195">Документация</text><text x="44" y="231" fill="#99999e">◈　Night Island</text><text x="24" y="270">›　Почитать</text><path d="M14 290h194" stroke="#ffffff12" /><text x="24" y="320" fill="#99999e">＋　Новая вкладка</text><text x="24" y="359" fill="#99999e">◉　История обновлений</text><rect x="12" y="475" width="200" height="34" rx="17" fill="#ffffff10" /><text x="27" y="496">♧　Вместе</text><circle cx="28" cy="540" r="12" fill="#ffffff12" stroke="#c3ccd9" /><text x="23" y="544" font-size="11">Н</text><text x="58" y="545" fill="#99999e">◫　 ⇆　 ◇</text><text x="189" y="545" fill="#99999e">⚙</text><text x="282" y="71" fill="#99999e" font-size="11">Документация / Вкладки</text><text x="282" y="119" font-size="24" font-weight="500">Вкладки и пространства</text><text x="282" y="154" fill="#99999e">Организация страниц и управление памятью.</text><path d="M282 180h760" stroke="#ffffff12" /><text x="282" y="217">Пространства</text><text x="282" y="248" fill="#99999e">Отдельные списки вкладок для работы, проектов и личных страниц.</text><text x="282" y="292">Папки</text><text x="282" y="323" fill="#99999e">Вложенные папки, закрепления и перенос страниц мышью.</text><text x="282" y="367">Выгрузка страниц</text><text x="282" y="398" fill="#99999e">Неактивная страница освобождает память и загружается при открытии.</text><rect x="282" y="441" width="174" height="36" rx="18" fill="#c3ccd9" /><text x="302" y="464" fill="#101012">Настройки памяти →</text></svg>