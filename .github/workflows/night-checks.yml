name: Night checks
on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:night
